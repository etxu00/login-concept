<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Concept</title>
  <link rel="stylesheet" href="styles.css">
  <script src="main.js" defer></script>
</head>

<body>
  <main>
    <!-- LOGOTIPO -->
    <img src="https://img.icons8.com/fluency/550/css3.png" alt="Logotipo" width="auto" height="50">
    <!-- ICONO -->
    <svg viewBox="0 0 100 100">
      <!-- FONDO -->
      <circle></circle>
      <g class="icon-user">
        <circle></circle>
        <circle></circle>
        <circle></circle>
      </g>
      <g class="icon-dots">
        <circle></circle>
        <circle></circle>
        <circle></circle>
        <circle></circle>
        <circle></circle>
        <circle></circle>
        <circle></circle>
        <circle></circle>
        <circle></circle>
      </g>
      <g class="icon-password">
        <text x="19.5" y="64">*</text>
        <text x="39.5" y="64">*</text>
        <text x="59.5" y="64">*</text>
        <text x="19.5" y="60">A</text>
        <text x="39.5" y="60">B</text>
        <text x="59.5" y="60">C</text>
      </g>
      <g class="icon-password-recovery">
        <path
          d="M 72.5 55 L 72.5 50 A 10 10 0 0 0 62.5 40 L 17.5 40 A 10 10 0 0 0 7.5 50 L 7.5 60 A 10 10 0 0 0 17.5 70 L 57.5 70"
          fill="none" stroke="currentColor"></path>
        <text x="19.5" y="64">*</text>
        <text x="39.5" y="64">*</text>
        <text x="59.5" y="64">*</text>
        <text x="59.5" y="64">?</text>
      </g>
      <g class="icon-door">
        <path d="M 30 85 L 30 15 L 70 15 L 70 85"></path>
        <rect x="30" y="15" width="40" height="70"></rect>
        <path d="M 60 50 A 2 2 0 1 1 60 50.01"></path>
      </g>
    </svg>
    <svg class="icon" viewBox="0 0 100 100" style="display: none;">
      <!-- FONDO -->
      <circle></circle>
      <!-- PERSON -->
      <circle></circle>
      <circle></circle>
      <circle></circle>
      <!-- PIN -->
      <circle></circle>
      <circle></circle>
      <circle></circle>
      <circle></circle>
      <circle></circle>
      <circle></circle>
      <circle></circle>
      <circle></circle>
      <circle></circle>
      <!-- OJO -->
      <!-- PUERTA CERRADA -->
      <!-- PUERTA ABIERTA -->
    </svg>
    <form>
      <label>
        <!-- USERNAME -->
        <input autocomplete="off" id="username" placeholder="Usuario">
      </label>
      <div>
        <!-- PASSWORD -->
        <label>
          <input autocomplete="off" id="password" placeholder="Contraseña" type="password">
          <span class="mask" id="password_mask"></span>
        </label>
        <!-- SHOW PASSWORD -->
        <label>
          <span data-checked="Ocultar contraseña">Mostrar contraseña</span>
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <path stroke="none" d="M0 0h24v24H0z" fill="none" />
            <!-- Abc -->
            <path d="M3 16v-6a2 2 0 1 1 4 0v6" />
            <path d="M3 13h4" />
            <path d="M10 8v6a2 2 0 1 0 4 0v-1a2 2 0 1 0 -4 0v1" />
            <path d="M20.732 12a2 2 0 0 0 -3.732 1v1a2 2 0 0 0 3.726 1.01" />
            <!-- *** -->
            <path d="M12 10v4" />
            <path d="M10 13l4 -2" />
            <path d="M10 11l4 2" />
            <path d="M5 10v4" />
            <path d="M3 13l4 -2" />
            <path d="M3 11l4 2" />
            <path d="M19 10v4" />
            <path d="M17 13l4 -2" />
            <path d="M17 11l4 2" />
          </svg>
          <input id="show_password" type="checkbox">
        </label>
      </div>
      <button>
        <span>Iniciar sesión</span>
      </button>
      <a href="#" id="password_recovery">¿Olvidaste tu contraseña?</a>
    </form>
</main>
<!-- TEMA DE COLOR -->
<fieldset>
  <legend>Tema</legend>
  <label>
    <input id="light_theme_color" type="radio" name="theme">
    <span aria-label="Claro">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M12 12m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" />
        <path d="M3 12h1m8 -9v1m8 8h1m-9 8v1m-6.4 -15.4l.7 .7m12.1 -.7l-.7 .7m0 11.4l.7 .7m-12.1 -.7l-.7 .7" />
      </svg>
    </span>
  </label>
  <label>
    <input id="dark_theme_color" type="radio" name="theme">
    <span aria-label="Oscuro">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1 -8.313 -12.454z" />
      </svg>
    </span>
  </label>
  <label>
    <input id="system_theme_color" type="radio" name="theme" checked>
    <span aria-label="Sistema">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
        <path stroke="none" d="M0 0h24v24H0z" fill="none" />
        <path d="M3 4a1 1 0 0 1 1 -1h16a1 1 0 0 1 1 1v12a1 1 0 0 1 -1 1h-16a1 1 0 0 1 -1 -1v-12z" />
        <path d="M3 13h18" />
        <path d="M8 21h8" />
        <path d="M10 17l-.5 4" />
        <path d="M14 17l.5 4" />
      </svg>
    </span>
  </label>
</fieldset>
</body>

</html>
